<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareerPilot AI</title>
<style>
  html, body { margin:0; height:100%; background:#05070d; display:flex; align-items:center; justify-content:center; }
  .loader { width:28px; height:28px; border:3px solid rgba(6,182,212,0.25); border-top-color:#06b6d4; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="loader"></div>

  <!-- This page only decides where to send the visitor; no dashboard UI lives here. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async function () {
      const { data } = await window.supabaseClient.auth.getSession();
      if (!data.session) {
        window.location.replace("auth/login.html");
        return;
      }

      if (!window.isAllowedUser(data.session.user)) {
        await window.supabaseClient.auth.signOut();
        window.location.replace("access-denied.html");
        return;
      }

      window.location.replace("dashboard.html");
    })();
  </script>
</body>
</html>
